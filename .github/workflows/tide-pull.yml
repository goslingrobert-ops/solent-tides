name: Solent tide pull

on:
  schedule:
    # 06:00 UTC daily. UK is UTC in winter, UTC+1 (BST) in summer, so this
    # lands at 6am GMT / 7am BST. Adjust the hour below if you want it to
    # always match local clock time (GitHub Actions cron is UTC only,
    # doesn't shift with BST automatically).
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  pull-tides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Fetch tide data
        env:
          ADMIRALTY_API_KEY: ${{ secrets.ADMIRALTY_API_KEY }}
          STATIONS: 'Portsmouth,Cowes,Bembridge,Yarmouth,Warsash'
        run: python solent_tide_report.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tide_data.csv
          git diff --quiet --cached || git commit -m "Update tide data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
